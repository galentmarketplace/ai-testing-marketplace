jenkins:
  systemMessage: "AI Testing Marketplace — Jenkins CI"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASS}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub token for cloning test repos"

unclassified:
  location:
    url: "http://localhost:8081/"

jobs:
  - script: >
      pipelineJob('ui-automation') {
        description('Runs the AI-generated Playwright automation against the target app.')
        parameters {
          stringParam('REPO', '', 'Git repo URL with the tests')
          stringParam('BRANCH', 'main', 'Branch to check out')
          stringParam('BASE_URL', '', 'App base URL under test')
          stringParam('LOGIN_EMAIL', '', 'App login email')
          stringParam('LOGIN_PASSWORD', '', 'App login password')
          stringParam('GREP', '', 'Optional Playwright --grep filter (e.g. @regression)')
        }
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                agent any
                stages {
                  stage('Checkout tests') {
                    steps { git branch: (params.BRANCH ?: 'main'), url: params.REPO, credentialsId: 'github' }
                  }
                  stage('Install') {
                    steps { sh 'export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1; export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright; npm ci --ignore-scripts || npm install --ignore-scripts || true; npm install -D @playwright/test@1.55.0 --ignore-scripts || true; npx playwright install chromium || true' }
                  }
                  stage('Playwright') {
                    steps {
                      sh 'export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright; export PLAYWRIGHT_JUNIT_OUTPUT_NAME=results/junit.xml; if [ -n "$GREP" ]; then npx playwright test --reporter=junit --grep "$GREP" || true; else npx playwright test --reporter=junit || true; fi'
                    }
                  }
                }
                post { always { junit allowEmptyResults: true, testResults: 'results/junit.xml' } }
              }
            ''')
          }
        }
      }
