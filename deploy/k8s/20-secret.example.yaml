# DO NOT COMMIT a filled-in copy. Create it from your .env instead:
#   kubectl -n ai-testing create secret generic marketplace-env --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: marketplace-env
  namespace: ai-testing
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-..."
  CLAUDE_MODEL: "claude-sonnet-5"
  LLM_PROVIDER: "anthropic"
  PUBLIC_URL: "https://testing.example.com"
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  JENKINS_URL: ""
  JENKINS_USER: ""
  JENKINS_TOKEN: ""
