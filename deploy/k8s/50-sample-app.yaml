# A demo app-under-test with EXPLICIT CPU/memory limits — the per-pod performance validation measures
# utilization against these limits, so a target without limits reports no percentages.
# Point a Configuration's app URL at http://sample-app.ai-testing.svc.cluster.local (or its Ingress),
# then run the Performance playbook with namespace=ai-testing, selector=app=sample-app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: ai-testing
  labels: { app: sample-app }
spec:
  replicas: 1                            # 1 replica = a true single-pod capacity ceiling
  selector:
    matchLabels: { app: sample-app }
  template:
    metadata:
      labels: { app: sample-app }
    spec:
      containers:
        - name: web
          image: kennethreitz/httpbin:latest   # ← replace with YOUR app image
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }   # the ceiling the perf report measures against
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: ai-testing
spec:
  selector: { app: sample-app }
  ports: [{ name: http, port: 80, targetPort: http }]
