# Publish the VS Code extension to the Visual Studio Marketplace (and Open VSX for Cursor/VSCodium)
# on a version tag like ext-v0.1.0. Requires repo secrets: VSCE_PAT (Azure DevOps PAT, Marketplace › Manage)
# and optionally OVSX_PAT (open-vsx.org token).
name: publish-vscode-extension
on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: vscode-extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run compile
      - name: Package
        run: npx @vscode/vsce package --no-dependencies
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
      - name: Publish to Open VSX (Cursor / VSCodium)
        if: ${{ secrets.OVSX_PAT != '' }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
      - name: Attach .vsix to the GitHub release
        uses: softprops/action-gh-release@v2
        with: { files: vscode-extension/*.vsix }
